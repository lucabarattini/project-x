# Fetches every job source and publishes the board for the site to read.
# This runs here and not on Vercel because a rebuild costs about 22 CPU-seconds,
# which is what used up the Hobby plan's 4 CPU-hours a month.
name: Build job board

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# id-token lets the run sign in to AWS without stored keys, to email job alerts.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Only the email needs AWS: if signing in fails, the board still builds.
      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.ALERT_ROLE_ARN != ''
        continue-on-error: true
        with:
          role-to-assume: ${{ vars.ALERT_ROLE_ARN }}
          aws-region: us-east-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/build-board.mts
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ALERT_FROM: Job digest <jobs@lucabarattini.com>
          ALERT_TO: ${{ secrets.ALERT_TO }}
